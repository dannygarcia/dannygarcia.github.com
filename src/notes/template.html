<!DOCTYPE html>
<html class="no-js" lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000">
    <meta name="description" content="{{ description }}" />
    <meta name="author" content="{{ author }}" />
    <meta name="date" content="{{ date }}" />
    <link rel="canonical" href="{{ url }}">
    <script>document.documentElement.classList.remove('no-js');</script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="canvas-container"></div>
    <main>
        <h1 class="logo"><a href="/">Danny <br>Garcia</a></h1>
        <article class="note-content">
            <header>
                <h2>{{ title }}</h2>
                <p>By {{ author }} on {{ date }}</p>
            </header>
            {{{ content }}}
        </article>
        <footer>
            <div class="footer-content">
                <p>You can follow me on <a href="https://www.threads.net/@dannygarcia">Threads</a>, <a href="https://www.instagram.com/dannygarcia/">Instagram</a>, and <a href="https://www.linkedin.com/in/dannygarcia1">LinkedIn</a>. Here’s my <a href="mailto:hey@danny-garcia.com">Email</a>.</p>
            </div>
        </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
    <script data-goatcounter="https://dannygarcia.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</html>
